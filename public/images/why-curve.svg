<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 620' width='1200' height='620'><rect width='1200' height='620' fill='#181818'/><text x='600' y='90' text-anchor='middle' fill='#F2F2F2' font-size='29' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>2. After deployment the model drifts. Today's fix comes weeks later. The judge holds the line.</text><path d='M150 150 L150 520 L1080 520' fill='none' stroke='#F2F2F2' stroke-width='2'/><text x='132' y='335.0' transform='rotate(-90 132 335.0)' text-anchor='middle' fill='#8A8F96' font-size='22' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>WRONG CLAIMS REACHING THE ACTION</text><text x='1070' y='560' text-anchor='end' fill='#8A8F96' font-size='22' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>TIME AFTER DEPLOYMENT</text><path d='M150 470 L300 470 L300 460 L420 380 L430 380 L450 470 L560 470 L560 462 L700 330 L715 330 L735 470 L880 470 L880 464 L1010 300 L1030 300 L1060 470' fill='none' stroke='#FF7B7B' stroke-width='3'/><text x='300' y='450' text-anchor='middle' fill='#8A8F96' font-size='20' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>new batch</text><line x1='300' y1='460' x2='300' y2='514' stroke='#8A8F96' stroke-dasharray='4 4'/><text x='560' y='450' text-anchor='middle' fill='#8A8F96' font-size='20' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>lens dust</text><line x1='560' y1='460' x2='560' y2='514' stroke='#8A8F96' stroke-dasharray='4 4'/><text x='880' y='450' text-anchor='middle' fill='#8A8F96' font-size='20' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>season</text><line x1='880' y1='460' x2='880' y2='514' stroke='#8A8F96' stroke-dasharray='4 4'/><text x='440' y='500' text-anchor='middle' fill='#FF7B7B' font-size='18' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>retrain</text><text x='725' y='500' text-anchor='middle' fill='#FF7B7B' font-size='18' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>retrain</text><text x='1040' y='500' text-anchor='middle' fill='#FF7B7B' font-size='18' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>retrain</text><path d='M150 466 L1060 462' fill='none' stroke='#3DDC97' stroke-width='3'/><text x='560' y='140' fill='#3DDC97' font-size='24' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>with the judge</text><text x='760' y='140' fill='#FF7B7B' font-size='24' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>model alone</text><text x='600' y='580' text-anchor='middle' fill='#8A8F96' font-size='24' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>the judge catches each wrong claim in milliseconds; the layer that failed is fixed on the device; the ledger records it</text></svg>