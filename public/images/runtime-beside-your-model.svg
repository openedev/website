<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 620' width='1200' height='620'><rect width='1200' height='620' fill='#181818'/><text x='600' y='90' text-anchor='middle' fill='#F2F2F2' font-size='30' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>Your model stays sealed. The runtime sits beside it, on your silicon.</text><rect x='120' y='250' width='230' height='120' rx='12' fill='none' stroke='#F2F2F2' stroke-width='2'/><text x='235' y='305' text-anchor='middle' fill='#F2F2F2' font-size='26' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>YOUR MODEL</text><text x='235' y='340' text-anchor='middle' fill='#8A8F96' font-size='18' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>sealed, unchanged</text><line x1='350' y1='310' x2='470' y2='310' stroke='#F2F2F2' stroke-width='2' stroke-dasharray='6 6'/><rect x='470' y='235' width='260' height='150' rx='14' fill='#F2F2F2'/><text x='600' y='300' text-anchor='middle' fill='#181818' font-size='30' font-weight='bold' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>JUDGE</text><text x='600' y='340' text-anchor='middle' fill='#181818' font-size='18' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>confirm · correct · abstain · ledger</text><line x1='730' y1='310' x2='850' y2='310' stroke='#F2F2F2' stroke-width='2' stroke-dasharray='6 6'/><rect x='850' y='250' width='230' height='120' rx='12' fill='none' stroke='#F2F2F2' stroke-width='2'/><text x='965' y='305' text-anchor='middle' fill='#F2F2F2' font-size='26' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>YOUR DECISION</text><text x='965' y='340' text-anchor='middle' fill='#8A8F96' font-size='18' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>on the verified claim</text><rect x='380' y='430' width='440' height='110' rx='14' fill='none' stroke='#8A8F96' stroke-width='2' stroke-dasharray='8 8'/><text x='600' y='420' text-anchor='middle' fill='#8A8F96' font-size='20' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>YOUR SILICON</text><text x='435' y='495' text-anchor='middle' fill='#F2F2F2' font-size='22' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>NXP</text><text x='545' y='495' text-anchor='middle' fill='#F2F2F2' font-size='22' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>Qualcomm</text><text x='655' y='495' text-anchor='middle' fill='#F2F2F2' font-size='22' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>DeepX</text><text x='765' y='495' text-anchor='middle' fill='#F2F2F2' font-size='22' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>Rockchip</text><text x='600' y='590' text-anchor='middle' fill='#8A8F96' font-size='24' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>one hook at the decision point, a few confirmed examples, nothing leaves the site</text></svg>