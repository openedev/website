<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 940' width='1200' height='940' font-family='Lato, Carlito, Calibri, Helvetica, Arial, sans-serif'>
<rect width='1200' height='940' fill='#181818'/>
<text x='600' y='70' text-anchor='middle' fill='#F2F2F2' font-size='34'>Deployed AI makes wrong claims. Correction fixes them on-device.</text>
<rect x='80' y='200' width='250' height='130' rx='6' fill='none' stroke='#B5B9BE' stroke-width='2' stroke-linecap='round' stroke-dasharray='0.1 6'/>
<text x='205' y='258' text-anchor='middle' fill='#F2F2F2' font-size='27' font-weight='bold'>Your model</text>
<text x='205' y='294' text-anchor='middle' fill='#8A8F96' font-size='21'>sealed, unchanged</text>
<line x1='332' y1='265' x2='418' y2='265' stroke='#F2F2F2' stroke-width='2'/><polygon points='418,259 430,265 418,271' fill='#F2F2F2'/>
<text x='380' y='240' text-anchor='middle' fill='#8A8F96' font-size='15' letter-spacing='1'>CLAIM</text>
<text x='380' y='295' text-anchor='middle' fill='#FF6B6B' font-size='17' font-weight='bold'>NEGATIVE</text>
<rect x='430' y='180' width='340' height='170' rx='14' fill='#F2F2F2'/>
<text x='600' y='238' text-anchor='middle' fill='#181818' font-size='30' font-weight='bold' letter-spacing='1'>CORRECTION</text>
<text x='600' y='278' text-anchor='middle' fill='#181818' font-size='22'>toolchain · judge</text>
<text x='600' y='306' text-anchor='middle' fill='#181818' font-size='22'>correct · ledger</text>
<line x1='772' y1='265' x2='858' y2='265' stroke='#F2F2F2' stroke-width='2'/><polygon points='858,259 870,265 858,271' fill='#F2F2F2'/>
<text x='820' y='240' text-anchor='middle' fill='#8A8F96' font-size='15' letter-spacing='1'>OVERRIDE</text>
<text x='820' y='295' text-anchor='middle' fill='#77DB89' font-size='17' font-weight='bold'>POSITIVE</text>
<rect x='870' y='200' width='250' height='130' rx='6' fill='none' stroke='#B5B9BE' stroke-width='2' stroke-linecap='round' stroke-dasharray='0.1 6'/>
<text x='995' y='258' text-anchor='middle' fill='#F2F2F2' font-size='27' font-weight='bold'>Your decision</text>
<text x='995' y='294' text-anchor='middle' fill='#8A8F96' font-size='21'>on the verified claim</text>
<text x='200' y='430' fill='#8A8F96' font-size='18' letter-spacing='2'>WHERE CORRECTION BELONGS</text>
<rect x='200' y='450' width='800' height='120' rx='6' fill='none' stroke='#B5B9BE' stroke-width='2' stroke-linecap='round' stroke-dasharray='0.1 6'/>
<text x='335' y='505' text-anchor='middle' fill='#F2F2F2' font-size='28'>Industrial</text>
<text x='335' y='540' text-anchor='middle' fill='#77DB89' font-size='15' font-weight='bold' letter-spacing='1.5'>IN PRODUCTION</text>
<text x='600' y='505' text-anchor='middle' fill='#F2F2F2' font-size='28'>Automotive</text>
<text x='600' y='540' text-anchor='middle' fill='#FFB454' font-size='15' font-weight='bold' letter-spacing='1.5'>VALIDATING</text>
<text x='865' y='505' text-anchor='middle' fill='#F2F2F2' font-size='28'>Robot</text>
<text x='865' y='540' text-anchor='middle' fill='#8A8F96' font-size='15' font-weight='bold' letter-spacing='1.5'>NEXT</text>
<text x='200' y='640' fill='#8A8F96' font-size='18' letter-spacing='2'>SIX CAUSES. ONE SYMPTOM.</text>
<text x='600' y='835' text-anchor='middle' fill='#F2F2F2' font-size='22'>On our battery line, 4 of 6 causes of wrong claims were not the model.</text>
<rect x='200' y='660' width='800' height='130' rx='6' fill='none' stroke='#B5B9BE' stroke-width='2' stroke-linecap='round' stroke-dasharray='0.1 6'/>
<text x='335' y='710' text-anchor='middle' fill='#F2F2F2' font-size='22' font-weight='bold' letter-spacing='2'>SENSOR</text>
<text x='335' y='755' text-anchor='middle' fill='#F2F2F2' font-size='21'>light · lens · belt</text>
<text x='600' y='710' text-anchor='middle' fill='#F2F2F2' font-size='22' font-weight='bold' letter-spacing='2'>CHIP</text>
<text x='600' y='755' text-anchor='middle' fill='#F2F2F2' font-size='21'>heat · dropped frames</text>
<text x='865' y='710' text-anchor='middle' fill='#F2F2F2' font-size='22' font-weight='bold' letter-spacing='2'>MODEL</text>
<text x='865' y='755' text-anchor='middle' fill='#F2F2F2' font-size='21'>drift · a new type</text>
<text x='600' y='895' text-anchor='middle' fill='#8A8F96' font-size='20'>Runs on your silicon: NPU · GPU. Nothing leaves the site.</text>
</svg>
