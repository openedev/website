<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 700' width='1200' height='700'><rect width='1200' height='700' fill='#181818'/><text x='600' y='80' text-anchor='middle' fill='#F2F2F2' font-size='30' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>1. A well-built model is wrong once in a hundred and cannot tell which one.</text><rect x='120' y='160' width='220' height='140' rx='12' fill='none' stroke='#F2F2F2' stroke-width='2'/><text x='230' y='240' text-anchor='middle' fill='#F2F2F2' font-size='30' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>MODEL</text><rect x='860' y='160' width='220' height='140' rx='12' fill='none' stroke='#F2F2F2' stroke-width='2'/><text x='970' y='240' text-anchor='middle' fill='#F2F2F2' font-size='30' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>ACTION</text><path d='M340 230 C 540 230, 640 178, 860 178' fill='none' stroke='#F2F2F2' stroke-width='1.5'/><circle cx='860' cy='178' r='5' fill='#F2F2F2'/><path d='M340 230 C 540 230, 640 196, 860 196' fill='none' stroke='#F2F2F2' stroke-width='1.5'/><circle cx='860' cy='196' r='5' fill='#F2F2F2'/><path d='M340 230 C 540 230, 640 214, 860 214' fill='none' stroke='#F2F2F2' stroke-width='1.5'/><circle cx='860' cy='214' r='5' fill='#F2F2F2'/><path d='M340 230 C 540 230, 640 232, 860 232' fill='none' stroke='#FF7B7B' stroke-width='3'/><circle cx='860' cy='232' r='5' fill='#FF7B7B'/><path d='M340 230 C 540 230, 640 250, 860 250' fill='none' stroke='#F2F2F2' stroke-width='1.5'/><circle cx='860' cy='250' r='5' fill='#F2F2F2'/><path d='M340 230 C 540 230, 640 268, 860 268' fill='none' stroke='#F2F2F2' stroke-width='1.5'/><circle cx='860' cy='268' r='5' fill='#F2F2F2'/><path d='M340 230 C 540 230, 640 286, 860 286' fill='none' stroke='#FF7B7B' stroke-width='3'/><circle cx='860' cy='286' r='5' fill='#FF7B7B'/><text x='600' y='350' text-anchor='middle' fill='#8A8F96' font-size='22' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>every output is a claim · a few are wrong · the wrong ones look exactly like the right ones</text><text x='600' y='378' text-anchor='middle' fill='#8A8F96' font-size='22' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>nothing stands between them and the action</text><text x='120' y='430' fill='#3DDC97' font-size='22' font-weight='bold' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>Our line</text><text x='270' y='430' fill='#F2F2F2' font-size='20' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>a battery line, 2026: 12 wrong claims per 100 decisions, as confident as the right ones; 9 of 9 caught by the judge</text><text x='120' y='480' fill='#3DDC97' font-size='22' font-weight='bold' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>Fixed scene</text><text x='270' y='480' fill='#CFD2D7' font-size='20' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>inspection models at a 1 % slip target shipped 7 to 10 % slip in the first production period (Siemens, 2025)</text><text x='120' y='530' fill='#6FB4FF' font-size='22' font-weight='bold' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>Moving scene</text><text x='270' y='530' fill='#CFD2D7' font-size='20' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>a standard vision model fell from 86 % to 32 % under real camera auto-exposure (ImageNet-ES, CVPR 2024)</text><text x='120' y='580' fill='#FFB454' font-size='22' font-weight='bold' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>Acting scene</text><text x='270' y='580' fill='#CFD2D7' font-size='20' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>the most capable robot model completed 7 of 100 real bimanual trials (Robocurve StationeryBench, Sept 2026)</text><text x='600' y='640' text-anchor='middle' fill='#8A8F96' font-size='18' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>Our line: measured on a production line, 2026. The rest: published measurements; every value and source is in our research notes.</text></svg>