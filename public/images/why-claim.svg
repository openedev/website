<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 860' width='1200' height='860'><rect width='1200' height='860' fill='#181818'/><text x='600' y='80' text-anchor='middle' fill='#F2F2F2' font-size='34' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>1. A well-built model is wrong once in a hundred and cannot tell which one.</text><rect x='120' y='170' width='220' height='120' rx='12' fill='none' stroke='#F2F2F2' stroke-width='2'/><text x='230' y='240' text-anchor='middle' fill='#F2F2F2' font-size='30' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>MODEL</text><rect x='860' y='170' width='220' height='120' rx='12' fill='none' stroke='#F2F2F2' stroke-width='2'/><text x='970' y='240' text-anchor='middle' fill='#F2F2F2' font-size='30' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>ACTION</text><path d='M340 230 C 520 230, 620 200, 858 200' fill='none' stroke='#F2F2F2' stroke-width='1.5'/><circle cx='856' cy='200' r='5' fill='#F2F2F2'/><path d='M340 230 C 520 230, 620 222, 858 222' fill='none' stroke='#F2F2F2' stroke-width='1.5'/><circle cx='856' cy='222' r='5' fill='#F2F2F2'/><path d='M340 230 C 520 230, 620 244, 858 244' fill='none' stroke='#F2F2F2' stroke-width='1.5'/><circle cx='856' cy='244' r='5' fill='#F2F2F2'/><path d='M340 230 C 520 230, 620 258, 858 258' fill='none' stroke='#FF7B7B' stroke-width='3'/><circle cx='856' cy='258' r='5' fill='#FF7B7B'/><path d='M340 230 C 520 230, 620 276, 858 276' fill='none' stroke='#F2F2F2' stroke-width='1.5'/><circle cx='856' cy='276' r='5' fill='#F2F2F2'/><path d='M340 230 C 520 230, 620 296, 858 296' fill='none' stroke='#F2F2F2' stroke-width='1.5'/><circle cx='856' cy='296' r='5' fill='#F2F2F2'/><path d='M340 230 C 520 230, 620 318, 858 318' fill='none' stroke='#FF7B7B' stroke-width='3'/><circle cx='856' cy='318' r='5' fill='#FF7B7B'/><text x='600' y='362' text-anchor='middle' fill='#8A8F96' font-size='22' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>every output is a claim · a few are wrong · the wrong ones look exactly like the right ones</text><text x='600' y='390' text-anchor='middle' fill='#8A8F96' font-size='22' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>nothing stands between them and the action</text><text x='120' y='440' fill='#3DDC97' font-size='22' font-weight='bold' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>Our line</text><text x='270' y='440' fill='#F2F2F2' font-size='19' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>a battery line, 2026: the detector fell from 93 % to 90 % after a new batch of material, lamp and lens untouched;</text><text x='270' y='468' fill='#F2F2F2' font-size='19' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>on the recorded tape 12 wrong claims per 100 decisions, as confident as the right ones; 9 of 9 caught by the judge</text><text x='120' y='532' fill='#3DDC97' font-size='22' font-weight='bold' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>Fixed scene</text><text x='270' y='532' fill='#CFD2D7' font-size='19' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>inspection models at a 1 % slip target shipped 7 to 10 % slip in the first production period (Siemens, 2025);</text><text x='270' y='560' fill='#CFD2D7' font-size='19' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>93 % validation F1 fell to 46 % in production (Sycodal, 2024)</text><text x='120' y='624' fill='#6FB4FF' font-size='22' font-weight='bold' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>Moving scene</text><text x='270' y='624' fill='#CFD2D7' font-size='19' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>a standard vision model fell from 86 % to 32 % under real camera auto-exposure (ImageNet-ES, CVPR 2024);</text><text x='270' y='652' fill='#CFD2D7' font-size='19' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>2024 emergency braking avoided 100 % of collisions at 35 mph and 0 % at 55 (AAA, 2024)</text><text x='120' y='716' fill='#FFB454' font-size='22' font-weight='bold' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>Acting scene</text><text x='270' y='716' fill='#CFD2D7' font-size='19' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>the most capable robot model completed 7 of 100 real bimanual trials (Robocurve StationeryBench, Sept 2026);</text><text x='270' y='744' fill='#CFD2D7' font-size='19' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>driving policies at 86 open-loop scored 50 to 54 closed-loop (nuPlan, 2023); remote help every 4 to 5 miles (Cruise)</text><text x='600' y='812' text-anchor='middle' fill='#8A8F96' font-size='18' font-family='Carlito, Calibri, Helvetica, Arial, sans-serif'>Our line: measured on a production line, 2026. The rest: published measurements; every value and source is in our research notes.</text></svg>